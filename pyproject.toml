[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "statuscake_py"
version = "1.2.0"
description = "StatusCake API client"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "StatusCake", email = "support@statuscake.com" }]
keywords = ["python", "sdk", "statuscake"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "urllib3>=2.2,<3",
    "pydantic>=2.9,<3",
    "python-dateutil>=2.8.2",
    "typing-extensions>=4.7.1",
]

[project.urls]
Homepage = "https://github.com/StatusCakeDev/statuscake-py"
Documentation = "https://developers.statuscake.com/guides/sdks/introduction"
Issues = "https://github.com/StatusCakeDev/statuscake-py/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-httpserver>=1.1",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-python-dateutil",
]

[tool.hatch.build.targets.wheel]
packages = ["statuscake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py39"
# Ruff has no way of turning the limit off. This is the largest it accepts.
line-length = 320
# Only the files written by hand in the templates are linted. The rest is code
# produced by the generator.
extend-exclude = [
    "statuscake/api",
    "statuscake/models",
    "statuscake/__init__.py",
    "statuscake/api_client.py",
    "statuscake/api_response.py",
    "statuscake/configuration.py",
    "statuscake/exceptions.py",
    "statuscake/rest.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
files = ["statuscake", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
strict_equality = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["statuscake.api.*", "statuscake.models.*", "statuscake.api_client", "statuscake.rest", "statuscake.configuration", "statuscake.exceptions"]
ignore_errors = true
