---
name: test
on:
  pull_request:
  push:
    branches:
    # Run on merge queue branches for branch protection compatibility.
    - gh-readonly-queue/**
    - master
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.x
        cache: pip
        cache-dependency-path: pyproject.toml
    # Dependency groups need pip 25.1 or later.
    - run: python -m pip install --upgrade pip
    - run: pip install -e . --group dev
    - run: ruff check .
    - run: mypy
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - 3.x
        - "3.14"
        - "3.13"
        - "3.12"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    # Dependency groups need pip 25.1 or later.
    - run: python -m pip install --upgrade pip
    - run: pip install -e . --group dev
    - run: pytest
